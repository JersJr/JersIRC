name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove IRC color codes safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text(encoding='utf-8')
          start = s.find('  String cleanIrcText(String text) {')
          if start >= 0:
              end = s.find('\n  }', start)
              if end >= 0:
                  end += 4
                  replacement = r'''  String cleanIrcText(String text) {
    var cleaned = text.replaceAll(RegExp(r'\x03(?:[0-9]{1,2}(?:,[0-9]{1,2})?)?'), '');
    cleaned = cleaned.replaceAll(RegExp(r'[\x02\x0F\x16\x1D\x1F]'), '');
    cleaned = cleaned.replaceFirst(RegExp(r'^\s*(?:0?[1-9]|1[0-5])(?=\s)'), '');
    return cleaned.trimLeft();
  }'''
                  s = s[:start] + replacement + s[end:]
          p.write_text(s, encoding='utf-8')
          PY

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: flutter create --platforms=android --project-name jersirc .

      - name: Enable Android internet permission
        run: sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JersIRC-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
