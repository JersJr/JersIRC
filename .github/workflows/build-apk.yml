name: Build Parloteo Android APK

on:
  push:
    branches: [ main, refactor/core-architecture, jersirc2-clean ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: flutter create --platforms=android --project-name jersirc .

      - name: Apply Parloteo app name and launcher icon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          text, labels = re.subn(r'android:label="[^"]*"', 'android:label="Parloteo"', text, count=1)
          text, icons = re.subn(r'android:icon="[^"]*"', 'android:icon="@drawable/parloteo_icon"', text, count=1)
          if labels != 1 or icons != 1:
              raise SystemExit('Could not apply Parloteo label/icon to Android manifest')
          text = re.sub(r'\s+android:roundIcon="[^"]*"', '', text)
          text = text.replace('android:icon="@drawable/parloteo_icon"', 'android:icon="@drawable/parloteo_icon"\n        android:roundIcon="@drawable/parloteo_icon"', 1)
          manifest.write_text(text, encoding='utf-8')

          icon = Path('android/app/src/main/res/drawable/parloteo_icon.xml')
          icon.parent.mkdir(parents=True, exist_ok=True)
          icon.write_text('''<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#080A12" android:pathData="M22,0 H86 Q108,0 108,22 V86 Q108,108 86,108 H22 Q0,108 0,86 V22 Q0,0 22,0 Z"/>
              <path android:fillColor="#15112D" android:pathData="M15,18 Q15,10 25,10 H83 Q98,10 98,25 V83 Q98,98 83,98 H25 Q10,98 10,83 V25 Z"/>
              <path android:fillColor="#6D28D9" android:pathData="M29,24 H59 Q83,24 83,46 Q83,68 59,68 H43 V80 Q43,85 38,89 L27,96 Q24,97 24,92 V31 Q24,24 29,24 Z"/>
              <path android:fillColor="#A855F7" android:pathData="M36,33 H58 Q72,33 72,46 Q72,58 58,58 H42 V45 Q42,40 36,40 Z"/>
              <path android:fillColor="#080A12" android:pathData="M43,42 H57 Q62,42 62,47 Q62,51 57,51 H43 Z"/>
              <path android:fillColor="#38BDF8" android:pathData="M27,67 H43 V80 Q43,85 38,89 L27,96 Z"/>
              <path android:fillColor="#F8FAFC" android:pathData="M43,45 m-3,0 a3,3 0,1 0,6 0 a3,3 0,1 0,-6 0"/>
              <path android:fillColor="#F8FAFC" android:pathData="M53,45 m-3,0 a3,3 0,1 0,6 0 a3,3 0,1 0,-6 0"/>
              <path android:fillColor="#F8FAFC" android:pathData="M63,45 m-3,0 a3,3 0,1 0,6 0 a3,3 0,1 0,-6 0"/>
          </vector>
          ''', encoding='utf-8')
          PY

      - name: Configure Android core library desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/build.gradle.kts')
          text = path.read_text(encoding='utf-8')
          if 'isCoreLibraryDesugaringEnabled = true' not in text:
              marker = 'android {\n'
              if marker not in text:
                  raise SystemExit('Android app android block not found')
              text = text.replace(marker, marker + '    compileOptions {\n        isCoreLibraryDesugaringEnabled = true\n    }\n', 1)
          if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:' not in text:
              marker = 'dependencies {\n'
              dependency = '    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n'
              if marker in text:
                  text = text.replace(marker, marker + dependency, 1)
              else:
                  text += '\n\ndependencies {\n' + dependency + '}\n'
          path.write_text(text, encoding='utf-8')
          PY

      - name: Configure Android foreground service
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/src/main/AndroidManifest.xml')
          text = path.read_text(encoding='utf-8')
          marker = '    <application'
          permissions = (
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n'
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_REMOTE_MESSAGING" />\n'
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n'
          )
          if 'android.permission.FOREGROUND_SERVICE_REMOTE_MESSAGING' not in text:
              text = text.replace(marker, permissions + marker, 1)
          service_marker = '    </application>'
          service = (
              '    <service\n'
              '        android:name="com.pravera.flutter_foreground_task.service.ForegroundService"\n'
              '        android:foregroundServiceType="remoteMessaging"\n'
              '        android:exported="false" />\n'
          )
          if 'com.pravera.flutter_foreground_task.service.ForegroundService' not in text:
              if service_marker not in text:
                  raise SystemExit('Android manifest application marker not found')
              text = text.replace(service_marker, service + service_marker, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Enable Android internet permission
        run: sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml

      - name: Configure production signing
        env:
          KEYSTORE_BASE64: ${{ secrets.JERSIRC_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.JERSIRC_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.JERSIRC_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEY_ALIAS"
          test -n "$STORE_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/jersirc-release.jks
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/build.gradle.kts')
          text = path.read_text(encoding='utf-8')
          if 'import java.util.Properties' in text:
              text = text.replace('import java.io.FileInputStream\nimport java.util.Properties\n\n', '')
          text = text.replace('import java.io.FileInputStream\n', '')
          loader_start = text.find('val keystoreProperties = Properties()')
          if loader_start >= 0:
              loader_end = text.find('android {', loader_start)
              if loader_end < 0:
                  raise SystemExit('android block not found')
              text = text[:loader_start] + text[loader_end:]
          signing_start = text.find('    signingConfigs {')
          if signing_start >= 0:
              signing_end = text.find('    buildTypes {', signing_start)
              if signing_end < 0:
                  raise SystemExit('buildTypes block not found')
              text = text[:signing_start] + text[signing_end:]
          signing = '''    signingConfigs {
              create("release") {
                  keyAlias = System.getenv("JERSIRC_KEY_ALIAS")
                  keyPassword = System.getenv("JERSIRC_STORE_PASSWORD")
                  storeFile = rootProject.file("jersirc-release.jks")
                  storePassword = System.getenv("JERSIRC_STORE_PASSWORD")
              }
          }
          '''
          text = text.replace('    buildTypes {\n', signing + '    buildTypes {\n', 1)
          text = text.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("release")', 1)
          if 'signingConfig = signingConfigs.getByName("release")' not in text:
              text = text.replace('        release {\n', '        release {\n            signingConfig = signingConfigs.getByName("release")\n', 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Apply safe UI and nickname patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('lib/screens/home_screen.dart')
          text = path.read_text(encoding='utf-8')

          old_nick = "  final nick = TextEditingController(text: 'JersIRC_User');"
          new_nick = "  final nick = TextEditingController(text: NicknameGenerator.generate());"
          if text.count(old_nick) == 1:
              text = text.replace(old_nick, new_nick, 1)
              import_line = "import '../nickname_generator.dart';\n"
              anchor = "import '../controllers/irc_controller.dart';\n"
              if import_line not in text and text.count(anchor) == 1:
                  text = text.replace(anchor, anchor + import_line, 1)

          text = text.replace("                Expanded(child: TextField(controller: nick, decoration: const InputDecoration(labelText: 'Nickname')),\n", "                Expanded(child: TextField(controller: nick, decoration: const InputDecoration(labelText: 'Nickname'))),\n", 1)

          marker = "                      if (r.unread > 0) ...[const SizedBox(width: 8), _BlinkingUnread(label: const Text(''), count: r.unread, color: _nickColor(r.name))],\n"
          addition = marker + "                      IconButton(tooltip: 'Cerrar privado', icon: const Icon(Icons.close, size: 17), padding: EdgeInsets.zero, constraints: const BoxConstraints(minWidth: 30, minHeight: 30), onPressed: () => _closeRoom(r.name)),\n"
          if text.count(marker) == 1 and "tooltip: 'Cerrar privado'" not in text:
              text = text.replace(marker, addition, 1)

          marker = "  Widget _chat(ChatRoomModel r) => Column(children: [\n    if (!controller.connected)\n"
          header = "  Widget _chat(ChatRoomModel r) => Column(children: [\n    if (r.privateChat)\n      Container(\n        width: double.infinity,\n        padding: const EdgeInsets.symmetric(horizontal: 14, vertical: 9),\n        decoration: const BoxDecoration(color: Color(0xFF202832), border: Border(bottom: BorderSide(color: Colors.white10))),\n        child: Row(children: [\n          Icon(Icons.person_outline, size: 18, color: _nickColor(r.name)),\n          const SizedBox(width: 8),\n          const Text('Chat privado con ', style: TextStyle(color: Colors.white70, fontSize: 13)),\n          Expanded(child: Text(r.name, overflow: TextOverflow.ellipsis, style: TextStyle(color: _nickColor(r.name), fontSize: 13, fontWeight: FontWeight.w700))),\n        ]),\n      ),\n    if (!controller.connected)\n"
          if text.count(marker) == 1 and "Chat privado con " not in text:
              text = text.replace(marker, header, 1)

          marker = "                  Expanded(child: room == null ? _welcome() : _chat(room!)),\n"
          swipe = "                  Expanded(\n                    child: room == null\n                        ? _welcome()\n                        : (room!.privateChat\n                            ? Dismissible(\n                                key: ValueKey('private-' + room!.name),\n                                direction: DismissDirection.endToStart,\n                                secondaryBackground: Container(\n                                  alignment: Alignment.centerRight,\n                                  padding: const EdgeInsets.symmetric(horizontal: 24),\n                                  color: Colors.redAccent.withOpacity(.18),\n                                  child: const Icon(Icons.delete_outline, color: Colors.redAccent),\n                                ),\n                                onDismissed: (_) => _closeRoom(room!.name),\n                                child: _chat(room!),\n                              )\n                            : _chat(room!)),\n                  ),\n"
          if text.count(marker) == 1 and "private-' + room!.name" not in text:
              text = text.replace(marker, swipe, 1)

          text = text.replace('            mainAxisSize: MainAxisSize.min,\n', '            mainAxisSize: MainAxisSize.max,\n', 1)
          old_status = "                SizedBox(width: 150, child: Text(controller.status, overflow: TextOverflow.ellipsis, style: const TextStyle(fontSize: 12))),\n"
          new_status = "                SizedBox(width: MediaQuery.sizeOf(context).width < 400 ? 105 : 150, child: Text(controller.status, textAlign: TextAlign.right, overflow: TextOverflow.ellipsis, style: const TextStyle(fontSize: 12))),\n"
          if text.count(old_status) == 1:
              text = text.replace(old_status, new_status, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build APK
        env:
          JERSIRC_KEY_ALIAS: ${{ secrets.JERSIRC_KEY_ALIAS }}
          JERSIRC_STORE_PASSWORD: ${{ secrets.JERSIRC_STORE_PASSWORD }}
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Parloteo-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n "s/^version: //p" pubspec.yaml | head -n 1)
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
            exit 0
          fi
          gh release create "$TAG" build/app/outputs/flutter-apk/app-release.apk \
            --title "Parloteo ${VERSION}" \
            --generate-notes

      - name: Cleanup signing files
        if: always()
        run: rm -f android/jersirc-release.jks android/key.properties
