name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply final JersIRC UI fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text(encoding='utf-8')

          # Clean IRC formatting/control characters and leaked color numbers.
          start = s.find('  String cleanIrcText(String text) {')
          if start >= 0:
              end = s.find('\n  }', start)
              if end >= 0:
                  end += 4
                  s = s[:start] + '''  String cleanIrcText(String text) {
    var cleaned = text.replaceAll(RegExp('\\u0003(?:\\d{1,2}(?:,\\d{1,2})?)?'), '');
    cleaned = cleaned.replaceAll(RegExp('[\\u0002\\u000F\\u0016\\u001D\\u001F]'), '');
    cleaned = cleaned.replaceFirst(RegExp(r'^\\s*\\d{1,2}(?=\\s)'), '');
    return cleaned.trimLeft();
  }''' + s[end:]

          # Remove placeholder dots and make rank + nickname appear together.
          old = """          ...users.map((user) {
            final prefix = current.modes[user] ?? '';
            return ListTile(dense: true, contentPadding: const EdgeInsets.symmetric(horizontal: 2), leading: Text(prefix.isEmpty ? '•' : prefix, style: TextStyle(fontWeight: FontWeight.bold, color: nickColor(user))), title: Text(user, overflow: TextOverflow.ellipsis, style: TextStyle(color: nickColor(user), fontWeight: FontWeight.w600)), onTap: () => showUserActions(user));
          }),
"""
          new = """          ...users.map((user) {
            final prefix = current.modes[user] ?? '';
            return InkWell(
              onTap: () => showUserActions(user),
              child: Padding(
                padding: const EdgeInsets.symmetric(horizontal: 2, vertical: 3),
                child: Row(children: [
                  if (prefix.isNotEmpty) Text(prefix, style: TextStyle(fontWeight: FontWeight.bold, color: nickColor(user))),
                  if (prefix.isNotEmpty) const SizedBox(width: 1),
                  Expanded(child: Text(user, overflow: TextOverflow.ellipsis, style: TextStyle(color: nickColor(user), fontWeight: FontWeight.w600))),
                ]),
              ),
            );
          }),
"""
          s = s.replace(old, new)

          # Bigger status on the right with semantic colors.
          old = """              SizedBox(width: 170, child: Text(status, overflow: TextOverflow.ellipsis, style: const TextStyle(fontSize: 12))),
"""
          new = """              SizedBox(width: 205, child: Text(status, textAlign: TextAlign.right, overflow: TextOverflow.ellipsis, style: TextStyle(fontSize: 14, fontWeight: FontWeight.w600, color: status.startsWith('Reconectando') ? Colors.amber : (status == 'Desconectado' ? Colors.redAccent : (connected ? const Color(0xFF8FB59B) : Colors.white70))))),
"""
          s = s.replace(old, new)

          # ERR_NICKNAMEINUSE: keep socket alive and show change-nick dialog.
          old = """      if (numeric != null && numeric >= 400 && numeric != 422) {
        status = friendlyError(m);
        if ({431, 432, 433, 436, 437, 451, 464, 465}.contains(numeric)) {
          connected = false;
          connecting = false;
          reconnectTimer?.cancel();
        }
      }
"""
          new = """      if (numeric != null && numeric >= 400 && numeric != 422) {
        status = friendlyError(m);
        if ({431, 432, 436, 437, 451, 464, 465}.contains(numeric)) {
          connected = false;
          connecting = false;
          reconnectTimer?.cancel();
        }
        if (numeric == 433) WidgetsBinding.instance.addPostFrameCallback((_) => _showNickTakenDialog());
      }
"""
          s = s.replace(old, new)

          marker = '  Future<void> connect({bool automatic = false}) async {'
          if 'void _showNickTakenDialog()' not in s:
              dialog = '''  void _showNickTakenDialog() {
    if (!mounted) return;
    final controller = TextEditingController(text: nick.text);
    showDialog<void>(
      context: context,
      builder: (ctx) => AlertDialog(
        title: const Text('Nickname en uso'),
        content: TextField(controller: controller, autofocus: true, decoration: const InputDecoration(labelText: 'Cambiar nickname')),
        actions: [
          TextButton(onPressed: () => Navigator.pop(ctx), child: const Text('Cancelar')),
          FilledButton(onPressed: () {
            final value = controller.text.trim();
            if (value.isEmpty) return;
            nick.text = value;
            client.changeNick(value);
            Navigator.pop(ctx);
          }, child: const Text('Cambiar')),
        ],
      ),
    ).whenComplete(controller.dispose);
  }

'''
              s = s.replace(marker, dialog + marker)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: flutter create --platforms=android --project-name jersirc .

      - name: Enable Android internet
        run: sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JersIRC-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
