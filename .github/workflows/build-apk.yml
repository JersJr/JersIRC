name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply JersIRC chat UI fixes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('lib/main.dart')
          s = p.read_text(encoding='utf-8')

          if 'final Set<String> ignoredUsers = {};' not in s:
              s = s.replace(
                  '  bool userHasScrolled = false;\n',
                  '  bool userHasScrolled = false;\n  final Set<String> ignoredUsers = {};\n'
              )

          old = """      if ((m.command == 'PRIVMSG' || m.command == 'NOTICE') && m.params.isNotEmpty) {\n        final target = m.params.first;\n"""
          new = """      if ((m.command == 'PRIVMSG' || m.command == 'NOTICE') && m.params.isNotEmpty) {\n        final target = m.params.first;\n        if (m.nick != null && ignoredUsers.contains(m.nick!.toLowerCase())) return;\n"""
          s = s.replace(old, new)

          old = """  void showUserActions(String user) {\n    showModalBottomSheet<void>(\n      context: context,\n      builder: (context) => SafeArea(child: Wrap(children: [\n        ListTile(leading: const Icon(Icons.alternate_email), title: Text('Mencionar @$user'), onTap: () {\n          Navigator.pop(context);\n          message.text = '${message.text}$user ';\n          message.selection = TextSelection.collapsed(offset: message.text.length);\n        }),\n        ListTile(leading: const Icon(Icons.chat_bubble_outline), title: const Text('Privado'), onTap: () {\n          Navigator.pop(context);\n          openPrivate(user);\n        }),\n      ])),\n    );\n  }\n"""
          new = """  void showUserActions(String user) {\n    final ignored = ignoredUsers.contains(user.toLowerCase());\n    showModalBottomSheet<void>(\n      context: context,\n      builder: (context) => SafeArea(child: Wrap(children: [\n        ListTile(leading: const Icon(Icons.alternate_email), title: Text('Mencionar @$user'), onTap: () {\n          Navigator.pop(context);\n          message.text = '${message.text}$user ';\n          message.selection = TextSelection.collapsed(offset: message.text.length);\n        }),\n        ListTile(leading: const Icon(Icons.chat_bubble_outline), title: const Text('Privado'), onTap: () {\n          Navigator.pop(context);\n          openPrivate(user);\n        }),\n        ListTile(\n          leading: Icon(ignored ? Icons.visibility : Icons.block_outlined),\n          title: Text(ignored ? 'Dejar de ignorar' : 'Ignorar'),\n          onTap: () {\n            Navigator.pop(context);\n            setState(() {\n              final key = user.toLowerCase();\n              if (ignored) {\n                ignoredUsers.remove(key);\n              } else {\n                ignoredUsers.add(key);\n              }\n            });\n          },\n        ),\n      ])),\n    );\n  }\n"""
          s = s.replace(old, new)

          marker = "  Color nickColor(String user) {\n"
          helpers = """  String cleanIrcText(String text) {\n    var cleaned = text.replaceAll(RegExp('\\\\u0003(?:\\\\d{1,2}(?:,\\\\d{1,2})?)?'), '');\n    cleaned = cleaned.replaceAll(RegExp('[\\\\u0002\\\\u000F\\\\u0016\\\\u001D\\\\u001F]'), '');\n    return cleaned;\n  }\n\n  int rankWeight(String user) {\n    final prefix = current.modes[user] ?? '';\n    if (prefix.contains('~')) return 0;\n    if (prefix.contains('&')) return 1;\n    if (prefix.contains('@')) return 2;\n    if (prefix.contains('%')) return 3;\n    if (prefix.contains('+')) return 4;\n    return 5;\n  }\n\n  Color privateTabColor(String user, {bool selected = false, bool unread = false}) {\n    final base = nickColor(user);\n    if (selected) return Color.lerp(base, const Color(0xFF11161C), 0.45)!;\n    if (unread) return Color.lerp(base, const Color(0xFF11161C), 0.25)!;\n    return Color.lerp(base, const Color(0xFF252D36), 0.55)!;\n  }\n\n"""
          if 'int rankWeight(String user)' not in s:
              s = s.replace(marker, helpers + marker)

          s = s.replace(
              "final users = current.users.toList()..sort();",
              "final users = current.users.toList()..sort((a, b) { final rank = rankWeight(a).compareTo(rankWeight(b)); return rank != 0 ? rank : a.toLowerCase().compareTo(b.toLowerCase()); });"
          )

          s = s.replace(
              "Material(color: selected ? const Color(0xFF53677D) : (room.privateChat && hasUnread && blink ? const Color(0xFF7A435C) : const Color(0xFF252D36)),",
              "Material(color: room.privateChat ? privateTabColor(room.name, selected: selected, unread: hasUnread && blink) : (selected ? const Color(0xFF53677D) : const Color(0xFF252D36)),",
          )

          s = s.replace(
              "Icon(room.privateChat ? Icons.person_outline : Icons.tag, size: 16),",
              "Icon(room.privateChat ? Icons.person_outline : Icons.forum_outlined, size: 16),",
          )

          old = """                  child: RichText(text: TextSpan(children: [\n                    TextSpan(text: '$user  ', style: TextStyle(fontWeight: FontWeight.bold, color: nickColor(user))),\n                    TextSpan(text: item.trailing, style: const TextStyle(color: Colors.white)),\n                  ])),\n"""
          new = """                  child: RichText(text: TextSpan(children: [\n                    TextSpan(text: '$user: ', style: TextStyle(fontWeight: FontWeight.bold, color: nickColor(user))),\n                    TextSpan(text: cleanIrcText(item.trailing), style: const TextStyle(color: Colors.white)),\n                  ])),\n"""
          s = s.replace(old, new)

          p.write_text(s, encoding='utf-8')
          PY

          if ! git diff --quiet -- lib/main.dart; then
            git config user.name 'JersIRC Bot'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add lib/main.dart
            git commit -m 'Fix IRC message formatting, ignore and room tabs'
            git push
          fi
      - name: Apply final compact UI polish
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text(encoding='utf-8')

          # Nick color stays on the sender label; message text itself stays white.
          s = s.replace(
              "TextSpan(text: '$user: ', style: const TextStyle(fontWeight: FontWeight.bold, color: Colors.white)),",
              "TextSpan(text: '$user: ', style: TextStyle(fontWeight: FontWeight.bold, color: nickColor(user))),"
          )

          # Compact room/PV tabs.
          s = s.replace("height: 58,", "height: 44,")
          s = s.replace("padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 7),", "padding: const EdgeInsets.symmetric(horizontal: 6, vertical: 4),")
          s = s.replace("padding: const EdgeInsets.symmetric(horizontal: 3),", "padding: const EdgeInsets.symmetric(horizontal: 2),")
          s = s.replace("padding: const EdgeInsets.only(left: 12, right: 5),", "padding: const EdgeInsets.only(left: 8, right: 3),")
          s = s.replace("Icon(room.privateChat ? Icons.person_outline : Icons.forum_outlined, size: 16),", "Icon(room.privateChat ? Icons.person_outline : Icons.forum_outlined, size: 14),")
          s = s.replace("const SizedBox(width: 5),", "const SizedBox(width: 4),", 1)
          s = s.replace("child: Text(room.name)),", "child: Text(room.name, style: const TextStyle(fontSize: 12))),")
          s = s.replace("const SizedBox(width: 6),\n                      Container(padding: const EdgeInsets.symmetric(horizontal: 6, vertical: 2),", "const SizedBox(width: 4),\n                      Container(padding: const EdgeInsets.symmetric(horizontal: 4, vertical: 1),")
          s = s.replace("fontSize: 11, fontWeight: FontWeight.bold", "fontSize: 10, fontWeight: FontWeight.bold", 1)
          s = s.replace("padding: const EdgeInsets.all(5),\n                      constraints: const BoxConstraints(minWidth: 30, minHeight: 30),\n                      icon: const Icon(Icons.close, size: 16),", "padding: const EdgeInsets.all(2),\n                      constraints: const BoxConstraints(minWidth: 24, minHeight: 24),\n                      icon: const Icon(Icons.close, size: 14),")

          # In private chats the channel user list is not shown.
          s = s.replace(
              "  Widget buildUsers() {\n    final users = current.users.toList()",
              "  Widget buildUsers() {\n    if (current.privateChat) return const SizedBox.shrink();\n    final users = current.users.toList()"
          )

          # Very small collapsed users strip showing count, tappable/swipeable.
          old = """        child: Container(width: 42, decoration: const BoxDecoration(color: Color(0xFF151B22), border: Border(left: BorderSide(color: Colors.white10))), child: const Center(child: Icon(Icons.people_alt_outlined, size: 21))),\n"""
          new = """        child: Container(\n          width: 30,\n          decoration: const BoxDecoration(color: Color(0xFF151B22), border: Border(left: BorderSide(color: Colors.white10))),\n          child: Center(child: Column(mainAxisSize: MainAxisSize.min, children: [\n            const Icon(Icons.people_alt_outlined, size: 14),\n            const SizedBox(height: 1),\n            Text('${current.users.length}', style: const TextStyle(fontSize: 9, color: Colors.white70)),\n          ])),\n        ),\n"""
          s = s.replace(old, new)

          # More compact visible user panel.
          s = s.replace("width: 155,", "width: 148,")
          s = s.replace("padding: const EdgeInsets.all(8), children: [", "padding: const EdgeInsets.all(6), children: [")
          s = s.replace("IconButton(tooltip: 'Ocultar usuarios', onPressed: () => setState(() => usersVisible = false), icon: const Icon(Icons.keyboard_double_arrow_right, size: 20))", "IconButton(tooltip: 'Ocultar usuarios', onPressed: () => setState(() => usersVisible = false), padding: EdgeInsets.zero, constraints: const BoxConstraints(minWidth: 28, minHeight: 28), icon: const Icon(Icons.keyboard_double_arrow_right, size: 17))")

          # Avoid showing raw IRC formatting/control characters in chat.
          s = s.replace(
              "String cleanIrcText(String text) {\n    var cleaned = text.replaceAll(RegExp(r'\\u0003(?:\\d{1,2}(?:,\\d{1,2})?)?'), '');\n    cleaned = cleaned.replaceAll(RegExp(r'[\\u0002\\u000F\\u0016\\u001D\\u001F]'), '');\n    return cleaned;\n  }",
              "String cleanIrcText(String text) {\n    var cleaned = text.replaceAll(RegExp('\\u0003(?:\\d{1,2}(?:,\\d{1,2})?)?'), '');\n    cleaned = cleaned.replaceAll(RegExp('[\\u0002\\u000F\\u0016\\u001D\\u001F]'), '');\n    return cleaned;\n  }"
          )

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit final UI polish
        run: |
          if ! git diff --quiet -- lib/main.dart; then
            git config user.name 'JersIRC Bot'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add lib/main.dart
            git commit -m 'Polish compact JersIRC chat UI'
            git push
          fi
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform
        run: flutter create --platforms=android --project-name jersirc .
      - name: Enable Android internet permission
        run: sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JersIRC-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
